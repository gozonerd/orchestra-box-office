name: Desktop CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'shared/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop

      - name: Run Rust tests
        run: cargo test -p orchestra-box-office-shared -p orchestra-box-office-desktop --lib

      - name: Install Node dependencies
        run: npm ci --workspace=desktop

      - name: Run JavaScript tests
        working-directory: desktop
        run: npm run test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop

      - name: Run clippy
        run: cargo clippy -p orchestra-box-office-shared -p orchestra-box-office-desktop -- -D warnings

      - name: Install Node dependencies
        run: npm ci --workspace=desktop

      - name: Run ESLint
        working-directory: desktop
        run: npm run lint

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-audit
        uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node dependencies
        run: npm ci --workspace=desktop

      - name: Run npm audit
        working-directory: desktop
        run: npm audit --production --audit-level=moderate || true

  build:
    name: Build Desktop
    runs-on: ${{ matrix.os }}
    needs: [test, lint]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./desktop

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libwebkit2gtk-4.0-dev build-essential curl wget libappindicator3-dev patchelf

      - name: Install Node dependencies
        run: npm ci --workspace=desktop

      - name: Build desktop (Tauri)
        working-directory: desktop
        run: npm run tauri:build

  bundle-artifacts:
    name: Bundle Build Artifacts
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release manifest
        run: |
          echo "Build: ${{ github.run_number }}" > artifacts/manifest.txt
          echo "Commit: ${{ github.sha }}" >> artifacts/manifest.txt
          echo "Branch: ${{ github.ref }}" >> artifacts/manifest.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds-${{ github.run_number }}
          path: artifacts

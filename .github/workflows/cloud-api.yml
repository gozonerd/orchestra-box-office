name: Cloud API CI/CD

on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "shared/**"
      - ".github/workflows/cloud-api.yml"
  pull_request:
    branches: [master]
    paths:
      - "api/**"
      - "shared/**"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cd api && cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo audit

  build-container:
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2
      - uses: docker/build-push-action@v4
        with:
          context: .
          file: ./api/Dockerfile
          tags: |
            orchestra-box-office-api:latest
            orchestra-box-office-api:${{ github.sha }}
          outputs: type=docker

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Fly.io (staging)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          ~/.fly/bin/flyctl deploy --app orchestra-box-office-staging

  security-scan:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
      - uses: rustsec/audit-check-action@v1

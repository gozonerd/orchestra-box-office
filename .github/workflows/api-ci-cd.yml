name: API CI/CD

on:
  push:
    branches: [master, develop]
    paths:
      - 'api/**'
      - 'shared/**'
      - '.github/workflows/api-ci-cd.yml'
  pull_request:
    branches: [master]
    paths:
      - 'api/**'
      - 'shared/**'

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./api

      - name: Run tests
        run: cargo test -p orchestra-box-office-api

  lint:
    name: Lint API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./api

      - name: Run clippy
        run: cargo clippy -p orchestra-box-office-api -- -D warnings

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-audit
        uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: semgrep --config=p/owasp-top-ten --config=p/rust --json api/src || true

      - name: Check for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2

  build-and-test-docker:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: orchestra-api:${{ github.sha }}

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [test, lint, security, build-and-test-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd api
          flyctl deploy --remote-only

      - name: Health check
        run: |
          sleep 10
          curl -f https://api.orchestraboxoffice.com/health || exit 1

  dast-scan:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.7.0
        with:
          target: 'https://api.orchestraboxoffice.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

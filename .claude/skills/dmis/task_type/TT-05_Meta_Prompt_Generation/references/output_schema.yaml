# Reference to authoritative schema
# See: schemas/tt05_output.yaml for full validation schema
schema_ref: "schemas/tt05_output.yaml"
task_type: "TT-05"
description: "Precisely-specified instructions and briefs for downstream AI agent execution with clarity and quality guardrails"
output_format: "YAML"
key_sections:
  - section: "task_overview"
    description: "Clear description of what the downstream agent must do"
  - section: "input_specification"
    description: "Definition of materials and context the agent will receive"
  - section: "output_requirements"
    description: "Exact specifications for deliverable format and structure"
  - section: "quality_criteria"
    description: "Definition of what constitutes successful task completion"
  - section: "guardrails"
    description: "Accuracy rules, anti-fabrication rules, and quality constraints"
  - section: "examples"
    description: "Gold-standard examples of expected output"
required_fields:
  - "title"
  - "task_type"
  - "version"
  - "task_overview"
  - "input_specification"
  - "output_requirements"
  - "quality_criteria"
  - "guardrails"
validation_rules:
  - "Task must be executable by downstream AI agent"
  - "Input specification must include all context needed for execution"
  - "Output requirements must be unambiguous and specific"
  - "All accuracy and anti-fabrication rules must be embedded"
  - "Examples must match specified output requirements"

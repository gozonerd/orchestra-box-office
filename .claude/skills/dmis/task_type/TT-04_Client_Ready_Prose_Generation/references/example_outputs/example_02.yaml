section_title: "5.2 Quality Assurance Framework"

section_prose: |
  StrongMinds implements a comprehensive data quality assurance framework that applies systematic rules and multi-layer verification to ensure accuracy and consistency across all digital health outputs. This framework builds on the Evidence-based Framework for Data quality (EFD) methodology, which provides proven approaches to assessing and maintaining data integrity throughout digital health system operations.

  The framework establishes nine Critical Accuracy Rules (ACC-001 through ACC-009) that serve as guardrails for all organizational outputs. These rules specify correct usage of terminology, organizational context, and factual claims. For example, Rule 001 requires clear distinction between CommCare's current deployment in Zambia and the exploratory pilot conducted in Uganda with Dimagi support. Rule 003 specifies that CommCare, as a platform, must be distinguished from Dimagi, the consulting firm providing implementation support. These distinctions prevent misunderstanding about current organizational deployments and partnership structures.

  Beyond accuracy rules, the framework incorporates Anti-Fabrication Rules (AFR-001 through AFR-006) for knowledge generation tasks. These rules require that every factual claim has a traceable source, that no statistics or quotes are invented, and that uncertain claims are flagged for verification. Together, the accuracy and anti-fabrication rules create guardrails that maintain organizational credibility and ensure decision-makers receive reliable information.

  The framework applies verification across three audit layers: requirements compliance verification (checking that all specified requirements appear in outputs), regulatory cross-reference verification (validating regulatory citations), and rule-based compliance testing (applying enumerated accuracy rules deterministically). This multi-layer approach achieves convergence thresholds of α ≥ 0.70 for quality assurance and α ≥ 0.75 for methodology application, ensuring systematic quality maintenance.


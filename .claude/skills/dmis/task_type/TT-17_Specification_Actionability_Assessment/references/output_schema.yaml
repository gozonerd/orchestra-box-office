---
schema_name: "TT-17 Specification Actionability Assessment Output"
version: v02_I
date: 2026-03-06

output_structure:
  specifications_evaluated:
    description: "All specification elements with actionability assessment"
    type: array

  actionability_scoring:
    description: "Score each specification on sufficiency for downstream execution"
    values: ["Fully Specified", "Partially Specified", "Underspecified"]

  gap_analysis:
    description: "Missing details for each underspecified element"
    items:
      specification_id: string
      gap_category: string
      missing_details: array
      impact: string
      remediation: string

  use_case_validation:
    description: "Can downstream consumer act on this specification?"
    type: array
    items:
      specification_id: string
      consumer_profile: string
      can_execute: boolean
      blockers: array

accuracy_rules_applied:
  - "All 9 Accuracy Rules (ACC-001 through ACC-009)"

quality_expectations:
  actionability_grounded: "Assessment based on actual downstream consumer capabilities"
  gap_prioritization: "Clear distinction between critical gaps and enhancement opportunities"
